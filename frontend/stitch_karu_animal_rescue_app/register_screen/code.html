<!DOCTYPE html><html lang="en" class="light"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Karuṇā - Register</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@600;700&amp;family=Hanken+Grotesk:wght@400;600;700&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary-container": "#616363",
                    "primary-fixed": "#9cf2e8",
                    "error-container": "#ffdad6",
                    "on-error": "#ffffff",
                    "surface-container": "#e5eeff",
                    "on-error-container": "#93000a",
                    "on-tertiary": "#ffffff",
                    "on-secondary-fixed-variant": "#454747",
                    "secondary-fixed": "#e2e2e2",
                    "surface-container-low": "#eef4ff",
                    "on-tertiary-fixed-variant": "#783200",
                    "surface-tint": "#006a63",
                    "secondary": "#5d5f5f",
                    "on-tertiary-fixed": "#341100",
                    "surface-variant": "#d9e3f4",
                    "tertiary-container": "#af4c00",
                    "inverse-on-surface": "#eaf1ff",
                    "secondary-fixed-dim": "#c6c6c7",
                    "secondary-container": "#dfe0e0",
                    "error": "#ba1a1a",
                    "tertiary-fixed": "#ffdbca",
                    "on-primary-fixed-variant": "#00504a",
                    "on-primary-fixed": "#00201d",
                    "background": "#f8f9ff",
                    "tertiary": "#893a00",
                    "on-surface": "#121c28",
                    "outline-variant": "#bdc9c6",
                    "surface-container-lowest": "#ffffff",
                    "surface-bright": "#f8f9ff",
                    "primary": "#005c55",
                    "on-primary": "#ffffff",
                    "on-primary-container": "#a3faef",
                    "surface-container-high": "#dfe9fa",
                    "inverse-surface": "#27313e",
                    "outline": "#6e7977",
                    "primary-fixed-dim": "#80d5cb",
                    "tertiary-fixed-dim": "#ffb690",
                    "surface": "#f8f9ff",
                    "on-tertiary-container": "#ffe6da",
                    "surface-container-highest": "#d9e3f4",
                    "inverse-primary": "#80d5cb",
                    "on-secondary": "#ffffff",
                    "on-background": "#121c28",
                    "surface-dim": "#d1dbec",
                    "primary-container": "#0f766e",
                    "on-surface-variant": "#3e4947",
                    "on-secondary-fixed": "#1a1c1c"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "base": "8px",
                    "sm": "12px",
                    "container-margin": "20px",
                    "xs": "4px",
                    "md": "20px",
                    "lg": "32px",
                    "gutter": "16px",
                    "xl": "48px"
            },
            "fontFamily": {
                    "title-md": ["Hanken Grotesk"],
                    "body-sm": ["Hanken Grotesk"],
                    "label-caps": ["Hanken Grotesk"],
                    "headline-lg-mobile": ["EB Garamond"],
                    "headline-lg": ["EB Garamond"],
                    "display-lg": ["EB Garamond"],
                    "body-lg": ["Hanken Grotesk"]
            },
            "fontSize": {
                    "title-md": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "34px", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "600"}],
                    "display-lg": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
    <style>
        body {
            font-family: 'Hanken Grotesk', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .jali-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0l30 30-30 30L0 30z' fill='%23005c55' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen jali-pattern">
<!-- Suppressed Navigation Shell as per "The Destination Rule" (Transactional screen) -->
<main class="flex flex-col items-center px-container-margin pt-xl pb-lg max-w-md mx-auto">
<!-- Brand Identity: Teal Paw Icon -->
<div class="mb-lg flex justify-center items-center w-16 h-16 bg-primary-fixed rounded-full shadow-sm animate-fade-in">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">pets</span>
</div>
<!-- Heading Section -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2 tracking-tight">Create Account</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Join the rescue community</p>
</div>
<!-- Registration Form -->
<form id="registerForm" class="w-full space-y-gutter">
<!-- Full Name -->
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">person</span>
<input type="text" id="fullname" placeholder="Full Name" required="" class="w-full pl-12 pr-4 py-4 bg-surface-container-lowest border-b-2 border-outline-variant focus:border-primary focus:ring-0 transition-all font-body-lg text-on-surface outline-none rounded-t-lg">
</div>
<!-- Email -->
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input type="email" id="email" placeholder="Email Address" required="" class="w-full pl-12 pr-4 py-4 bg-surface-container-lowest border-b-2 border-outline-variant focus:border-primary focus:ring-0 transition-all font-body-lg text-on-surface outline-none rounded-t-lg">
</div>
<!-- Phone Number -->
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">call</span>
<input type="tel" id="phone" placeholder="Phone Number" required="" class="w-full pl-12 pr-4 py-4 bg-surface-container-lowest border-b-2 border-outline-variant focus:border-primary focus:ring-0 transition-all font-body-lg text-on-surface outline-none rounded-t-lg">
</div>
<!-- Password -->
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input type="password" id="password" placeholder="Password" required="" class="w-full pl-12 pr-12 py-4 bg-surface-container-lowest border-b-2 border-outline-variant focus:border-primary focus:ring-0 transition-all font-body-lg text-on-surface outline-none rounded-t-lg">
<button type="button" onclick="togglePasswordVisibility()" class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors">
<span id="eyeIcon" class="material-symbols-outlined">visibility</span>
</button>
</div>
<!-- Role Selection -->
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">badge</span>
<select id="role" required="" class="w-full pl-12 pr-4 py-4 bg-surface-container-lowest border-b-2 border-outline-variant focus:border-primary focus:ring-0 transition-all font-body-lg text-on-surface outline-none rounded-t-lg appearance-none">
<option value="" disabled="" selected="">Select your role</option>
<option value="citizen">Citizen</option>
<option value="ngo">NGO Staff</option>
<option value="volunteer">Volunteer</option>
<option value="vet">Vet</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline pointer-events-none">arrow_drop_down</span>
</div>
<!-- Submit Button -->
<div class="pt-lg">
<button type="submit" class="w-full py-4 bg-primary text-on-primary font-title-md text-title-md rounded-full shadow-md active:scale-95 transition-transform duration-150 flex justify-center items-center gap-2">
<span>Create Account</span>
<span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
</form>
<!-- Footer Link -->
<div class="mt-xl text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Already have an account? 
                <a href="#" class="text-primary font-bold hover:underline ml-1">Sign In</a>
</p>
</div>
<!-- Policy Footnote -->
<div class="mt-xl opacity-40 text-center max-w-[280px]">
<p class="text-[10px] uppercase tracking-widest font-label-caps">Empowering local rescue ecosystems through technology and compassion.</p>
</div>
</main>
<!-- Success Feedback Overlay (Hidden by default) -->
<div id="successOverlay" class="fixed inset-0 bg-surface/95 backdrop-blur-sm z-[100] flex flex-col items-center justify-center p-xl hidden">
<div class="w-24 h-24 bg-primary-fixed rounded-full flex items-center justify-center mb-lg scale-0 transition-transform duration-500" id="successCircle">
<span class="material-symbols-outlined text-primary text-[48px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface text-center mb-2">Welcome to Karuṇā</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant text-center max-w-xs">Your account has been created. Ready to start saving lives?</p>
</div>
<script>
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.textContent = 'visibility_off';
            } else {
                pwdInput.type = 'password';
                eyeIcon.textContent = 'visibility';
            }
        }

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Visual feedback logic
            const overlay = document.getElementById('successOverlay');
            const circle = document.getElementById('successCircle');
            
            overlay.classList.remove('hidden');
            setTimeout(() => {
                circle.classList.add('scale-100');
            }, 100);

            // Mock redirection after 2 seconds
            setTimeout(() => {
                window.location.reload();
            }, 2500);
        });

        // Add subtle focus state listeners to parents for better visual feedback
        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>
</body></html>
