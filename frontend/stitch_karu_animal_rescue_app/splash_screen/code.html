<!DOCTYPE html><html lang="en" class="light"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Karuṇā - Splash Screen</title>
    <!-- Google Fonts: EB Garamond for Serif, Hanken Grotesk for Sans -->

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        darkMode: "class",
        theme: {
          extend: {

                    "surface-dim": "#d1dbec",

                    "inverse-on-surface": "#eaf1ff",
                    "surface": "#f8f9ff",
                    "on-secondary-fixed-variant": "#454747",
                    "outline": "#6e7977",
                    "on-secondary-container": "#616363",
                    "secondary-fixed-dim": "#c6c6c7",
                    "surface-container-low": "#eef4ff",
                    "error": "#ba1a1a",
                    "tertiary-fixed-dim": "#ffb690",
                    "secondary-fixed": "#e2e2e2",
                    "tertiary-container": "#af4c00",
                    "inverse-surface": "#27313e",
                    "outline-variant": "#bdc9c6",
                    "on-tertiary-fixed-variant": "#783200",
                    "on-tertiary-fixed": "#341100",
                    "secondary-container": "#dfe0e0",
                    "surface-container-lowest": "#ffffff",
                    "on-error": "#ffffff",
                    "on-tertiary": "#ffffff",
                    "tertiary-fixed": "#ffdbca",
                    "surface-tint": "#006a63",
                    "tertiary": "#893a00",
                    "on-secondary": "#ffffff",
                    "primary-container": "#0f766e",
                    "surface-container-highest": "#d9e3f4",
                    "primary-fixed": "#9cf2e8",
                    "background": "#f8f9ff",
                    "primary": "#005c55",
                    "on-primary-fixed-variant": "#00504a",
                    "on-secondary-fixed": "#1a1c1c",
                    "surface-container": "#e5eeff",
                    "error-container": "#ffdad6",
                    "on-error-container": "#93000a",
                    "surface-container-high": "#dfe9fa",
                    "on-tertiary-container": "#ffe6da",
                    "surface-variant": "#d9e3f4",
                    "secondary": "#5d5f5f",
                    "on-primary-container": "#a3faef",
                    "inverse-primary": "#80d5cb",
                    "on-background": "#121c28",
                    "on-surface": "#121c28"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "lg": "32px",
                    "container-margin": "20px",
                    "sm": "12px",
                    "md": "20px",
                    "base": "8px",
                    "xl": "48px",
                    "xs": "4px",
                    "gutter": "16px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["EB Garamond"],
                    "body-lg": ["Hanken Grotesk"],
                    "display-lg": ["EB Garamond"],
                    "title-md": ["Hanken Grotesk"],

            "fontSize": {

                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "display-lg": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "title-md": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],

                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}]

          },
        },
      }

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0F766E; /* Specific requested Dark Teal */
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }

        /* Subtle Indian Geometric Pattern Watermark (Jali) */
        .jali-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0l30 30-30 30L0 30z' fill='%23ffffff' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-loading {
            animation: spin 1s linear infinite;
        }

        .brand-fade-in {
            animation: fadeIn 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen text-on-primary select-none">
<!-- Subtle Pattern Overlay -->
<div class="jali-pattern"></div>
<!-- Main Content Container -->
<main class="relative z-10 flex flex-col items-center justify-center text-center">
<!-- Logo / Icon -->
<div class="mb-6 brand-fade-in" style="animation-delay: 0.1s;">
<span class="material-symbols-outlined text-[96px] text-white opacity-95" data-icon="pets" style="font-variation-settings: 'FILL' 1;">
                pets
            </span>
</div>
<!-- Brand Name -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-white tracking-wide brand-fade-in" style="animation-delay: 0.3s;">
            Karuṇā
        </h1>
<!-- Tagline -->
<p class="font-label-caps text-label-caps text-white/80 mt-2 uppercase brand-fade-in" style="animation-delay: 0.5s;">
            Rescue. Heal. Adopt.
        </p>
</main>
<!-- Bottom Loading Spinner -->
<footer class="absolute bottom-16 flex flex-col items-center brand-fade-in" style="animation-delay: 0.8s;">
<div class="w-8 h-8 border-2 border-white/20 border-t-white rounded-full animate-loading"></div>
</footer>
<!-- Micro-interaction script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Optional: simulate transition to home after few seconds or interaction
            // In a real app, this would be handled by the splash screen logic
            console.log("Karuṇā Splash Screen Loaded");
            
            // Haptic feedback simulation for a "premium" feel on press
            document.body.addEventListener('click', () => {
                const icon = document.querySelector('[data-icon="pets"]');
                icon.style.transform = 'scale(1.1)';
                setTimeout(() => {
                    icon.style.transform = 'scale(1.0)';
                }, 200);
            });
        });
    </script>
</body></html>
