<!-- Script for interaction -->
<script>
        const sheet = document.getElementById('bottom-sheet');
        const handle = document.getElementById('sheet-handle');
        let startY;
        let startTransform;
        let isDragging = false;

        handle.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
            isDragging = true;
            sheet.classList.remove('transition-transform');
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const currentY = e.touches[0].clientY;
            const deltaY = currentY - startY;
            if (deltaY > 0) { // Only allow dragging down
                sheet.style.transform = `translateY(${deltaY}px)`;
            }
        });

        window.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            isDragging = false;
            sheet.classList.add('transition-transform');
            
            const currentY = e.changedTouches[0].clientY;
            const deltaY = currentY - startY;
            
            if (deltaY > 100) {
                // Collapse logic - keep 100px visible
                sheet.style.transform = `translateY(calc(100% - 100px))`;
            } else {
                // Reset to open
                sheet.style.transform = `translateY(0)`;
            }
        });

        // Click to toggle if on desktop
        handle.addEventListener('click', () => {
            if (sheet.style.transform === 'translateY(calc(100% - 100px))') {
                sheet.style.transform = 'translateY(0)';
            } else {
                sheet.style.transform = 'translateY(calc(100% - 100px))';
            }
        });
    </script>
