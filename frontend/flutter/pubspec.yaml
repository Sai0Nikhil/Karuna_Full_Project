name: karuna_app
description: Karuṇā – Animal Welfare App (Citizen + NGO + Volunteer Portal)
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP & networking
  http: ^1.2.1

  # WebSockets (for real-time NGO dashboard)
  web_socket_channel: ^3.0.1

  # State management
  provider: ^6.1.2

  # Local storage (JWT token)
  shared_preferences: ^2.2.3

  # Image picker (for report flow)
  image_picker: ^1.1.2

  # Location
  geolocator: ^12.0.0

  # URL launcher (maps, phone calls)
  url_launcher: ^6.2.6

  # UI extras
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.6

  # Voice features for Sita
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # PDF Generation & Printing
  pdf: ^3.10.8
  printing: ^5.11.1

  # Mapping & Navigation Routing
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Push Notifications (Firebase Cloud Messaging)
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
