spring:
  config:
    activate:
      on-profile: dev

  jpa:
    hibernate:
      ddl-auto: ${DEV_JPA_HIBERNATE_DDL_AUTO}
    show-sql: ${DEV_JPA_SHOW_SQL}
    properties:
      hibernate:
        format_sql: ${DEV_HIBERNATE_FORMAT_SQL}

  flyway:
    clean-disabled: ${DEV_FLYWAY_CLEAN_DISABLED}

management:
  endpoint:
    health:
      show-details: ${DEV_MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS}

logging:
  level:
    com.karuna: ${DEV_LOG_LEVEL_KARUNA}
    org.springframework.security: ${DEV_LOG_LEVEL_SPRING_SECURITY}
    org.hibernate.SQL: ${DEV_LOG_LEVEL_HIBERNATE_SQL}
