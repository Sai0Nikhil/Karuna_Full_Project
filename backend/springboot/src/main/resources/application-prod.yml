spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      ddl-auto: ${PROD_JPA_HIBERNATE_DDL_AUTO}
    show-sql: ${PROD_JPA_SHOW_SQL}
    properties:
      hibernate:
        format_sql: ${PROD_HIBERNATE_FORMAT_SQL}

  flyway:
    clean-disabled: ${PROD_FLYWAY_CLEAN_DISABLED}

logging:
  level:
    root: ${PROD_LOG_LEVEL_ROOT}
    com.karuna: ${PROD_LOG_LEVEL_KARUNA}
    org.springframework.security: ${PROD_LOG_LEVEL_SPRING_SECURITY}
    org.hibernate.SQL: ${PROD_LOG_LEVEL_HIBERNATE_SQL}

management:
  endpoint:
    health:
      show-details: ${PROD_MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS}

springdoc:
  swagger-ui:
    enabled: ${PROD_SPRINGDOC_SWAGGER_UI_ENABLED}
