name: karuna_app
description: Karuṇā – Animal Welfare App (Citizen + NGO Portal)
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # HTTP & networking
  http: ^1.2.1
  # State management
  provider: ^6.1.2
  # Local storage (JWT token)
  shared_preferences: ^2.2.3
  # Image picker (for report flow)
  image_picker: ^1.1.2
  # Location
  geolocator: ^12.0.0
  # UI extras
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
